apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossly-ui
  labels:
    app.kubernetes.io/name: crossly-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: crossly
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crossly-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crossly-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: crossly
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: crossly-ui
      containers:
        - name: ui
          # tag comes from the images entry in kustomization.yaml
          image: ghcr.io/textyly/crossly-ui
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
